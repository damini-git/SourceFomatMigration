<template>
    <lightning-card>
        <div style="background-color:white">

            <template if:true={showOnPageLoad}>
                <!-- Header Section -->
                <div class="slds-p-around_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-col">
                            <h1 class="slds-text-heading_large slds-text-color_default"
                                style="color: #3670b6; font-size: 26px; font-weight: bold;">
                                All Refresh Templates
                            </h1>
                        </div>
                        <div class="slds-col slds-grid slds-grid_align-end">
                            <!-- Separate Create and Clone Buttons -->
                            <lightning-button variant="brand" label="Create Template" onclick={handleNew}
                                class="slds-m-right_small"></lightning-button>
                            <lightning-button variant="brand" label="Clone Template"
                                onclick={handleClone}></lightning-button>
                        </div>
                    </div>

                    <!-- Metrics and Search Bar - Horizontal Line Style -->
                    <div class="slds-grid slds-grid_align-spread slds-p-top_small slds-p-bottom_small">
                        <!-- Left side: Total Records -->
                        <div class="slds-col">
                            <span class="slds-badge slds-m-right_small">Total Records: {totalRecordsReF}</span>
                            <span class="slds-badge" if:true={sortedBy}>{sortedByColumnText}</span>
                        </div>

                        <!-- Right side: Search Input and Refresh Button -->
                        <div class="slds-col slds-grid slds-grid_align-end">
                            <lightning-input type="search"
                                placeholder="Search by template name, source org, or target org"
                                onchange={handleSearchTemplates} class="slds-m-right_small" variant="label-hidden"
                                style="width: 300px;" icon-name="utility:search" icon-size="small">
                            </lightning-input>

                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh Table"
                                variant="border-filled" onclick={handleRefreshTable} class="slds-m-left_x-small">
                            </lightning-button-icon>
                        </div>
                    </div>

                    <!-- Data Table (Moved up a bit) -->
                    <div class="slds-p-vertical_small slds-m-top_medium" style="margin-top: -8px;">
                        <!-- Loading Spinner -->
                        <template if:true={showSpinner}>
                            <div class="spinner-container">
                                <lightning-spinner alternative-text="Refreshing Table..." size="medium" variant="brand">
                                </lightning-spinner>
                            </div>
                        </template>
                        <lightning-datatable key-field="Id" data={refTempplatesToDisplay} columns={refTempColumn}
                            sorted-by={sortedBy} sorted-direction={sortDirectionTemplate} show-row-number-column
                            onrowaction={handleRefTempRow} hide-checkbox-column onsort={handleSortTemplates}
                            default-sort-direction="asc"></lightning-datatable>

                    </div>

                    <!-- Pagination Controls -->
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-top_small">
                        <!-- Page Size Selector -->
                        <div class="slds-col slds-grid slds-grid_vertical-align-center">
                            <span class="slds-badge slds-m-right_x-small">Page Size:</span>
                            <div class="slds-select_container" style="width: 100px;">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option}>{option}</option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <!-- Navigation Buttons -->
                        <div class="slds-col slds-grid slds-grid_align-center">
                            <lightning-button-group>
                                <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left"
                                    label="First" onclick={firstPage}></lightning-button>
                                <lightning-button disabled={bDisablePrevious} icon-name="utility:chevronleft"
                                    label="Previous" onclick={previousPage}></lightning-button>
                                <div class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_medium">
                                    <span class="slds-badge"> Showing {pageNumberRef} of {totalPagesRef} Page(s) </span>
                                </div>
                                <lightning-button disabled={bDisableNext} icon-name="utility:chevronright" label="Next"
                                    onclick={nextPage} icon-position="right"></lightning-button>
                                <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label="Last"
                                    onclick={lastPage} icon-position="right"></lightning-button>
                            </lightning-button-group>
                        </div>

                        <!-- Total Records Badge -->
                        <div class="slds-col slds-grid slds-grid_align-end">
                            <span class="slds-badge">Total Records: {totalRecordsReF}</span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- START OF NEW PAGE CODE BLOCK -->

            <template if:true={isNewPage}>
                <lightning-layout vertical-align="top">
                    <lightning-layout-item padding="around-small" size="6">
                        <div class="slds-text-align_right">
                            <header class="slds-truncate utils" style="display: flex; align-items: right;">
                                <p style="color: #3670b6; font-size:20px; font-weight: bold;">
                                    Choose an option to Create a Template
                                </p>
                            </header>
                        </div><br />
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="6">
                        <div class="right-aligned-container">
                            <lightning-button variant="brand" label="Back" title="Back" onclick={handleBackFromNewPage}
                                class="slds-m-left_x-small"></lightning-button>
                            &nbsp; &nbsp; <lightning-button variant="brand" label="Next" title="Next"
                                onclick={handleNextFromNewPage} class="slds-m-left_x-small"></lightning-button>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>

                <div style="height:70vh; width:98%; margin-left:auto; margin-right:auto" tabindex="0">
                    <h2
                        style="text-align: left; color: #040505; font-size: 18px;font-weight: normal; margin-bottom: 6px; margin-top: 40px;">
                        Please select one of the options to proceed with template creation.
                    </h2>
                    <div class="slds-p-around_medium" style="margin-top: -20px;">
                        <lightning-radio-group class="radio-group" style="font-size: xx-large;font-weight: bold;"
                            options={options} value={selectedOption} onchange={handleOptionChange}>
                        </lightning-radio-group>
                    </div>

                    <!--<template if:true={isExistingTemplate}>
                        <lightning-combobox
                            name="selectTemplate"
                            label="Select Template"
                            style="width:30%; margin-top: 20px;"
                            value={selectedTemplate}
                            options={templateOptions}
                            onchange={handleTemplates}>
                        </lightning-combobox>
                        <br/>
                    </template>-->
                </div>

                <!-- Confirmation Modal -->
                <template if:true={showBackConfirmationModal}>
                    <section role="dialog" tabindex="-1" aria-labelledby="back-modal-heading" aria-modal="true"
                        aria-describedby="back-modal-content" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <!-- Modal Header -->
                            <header class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                    title="Close" onclick={handleBackCancellation}>
                                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                        size="small"></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                                <h2 id="back-modal-heading" class="slds-modal__title slds-hyphenate">
                                    <lightning-icon icon-name="utility:warning" alternative-text="warning" size="small"
                                        class="slds-var-m-right_small" variant="warning"></lightning-icon>
                                    Confirm Navigation
                                </h2>
                            </header>

                            <!-- Modal Body -->
                            <div class="slds-modal__content slds-p-around_medium" id="back-modal-content">
                                <div class="slds-text-heading_small slds-var-p-bottom_small">
                                    Your changes will be lost
                                </div>
                                <p>
                                    Are you sure you want to go back? This action will clear all your selected data and
                                    cannot be undone.
                                </p>
                            </div>

                            <!-- Modal Footer -->
                            <footer class="slds-modal__footer">
                                <lightning-button label="Cancel" variant="neutral" onclick={handleBackCancellation}
                                    class="slds-var-m-right_x-small"></lightning-button>
                                <lightning-button label="Confirm" variant="brand"
                                    onclick={handleBackConfirmation}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>
            </template>

            <!-- END OF NEW PAGE CODE BLOCK -->


            <!-- METADATA PICKER PAGE UNDER CREATE NEW TEMPLATE -->

            <template if:true={isMetadataPicker}>
                <div class="slds-grid slds-grid_vertical-align-center slds-p-around_medium">
                    <div class="progress-path-container">
                        <div class="progress-path">
                            <!-- Metadata Retrieval (Step 1) -->
                            <div class={getStepClass1}>
                                <div class="step-label">Metadata Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep1Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep1Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 1 -->
                            <div class={getLine1Class}></div>

                            <!-- Metadata Transformation (Step 2) -->
                            <div class={getStepClass2}>
                                <div class="step-label">Metadata Transformation</div>
                                <div class="step-icon">
                                    <template if:true={isStep2Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep2Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 2 -->
                            <div class={getLine2Class}></div>

                            <!-- Data Retrieval (Step 3) -->
                            <div class={getStepClass3}>
                                <div class="step-label">Data Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep3Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep3Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 3 -->
                            <div class={getLine3Class}></div>

                            <!-- Final Review (Step 4) -->
                            <div class={getStepClass4}>
                                <div class="step-label">Final Review</div>
                                <div class="step-icon">
                                    <template if:true={isStep4Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep4Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <lightning-layout vertical-align="top">
                    <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                        <div class="slds-text-align_right">
                            <header class="slds-truncate utils" style="display: flex; align-items: right;">
                                <h1 class="slds-section__title utilTitle1">
                                    <p style="color: #3670b6; font-size:26px; font-weight: bold;">Metadata Retrieval</p>
                                </h1>
                            </header>
                        </div><br />
                    </lightning-layout-item>

                    <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                        <div class="right-aligned-container">
                            <lightning-button variant="brand" label="Back" title="Back" onclick={handleBack}
                                class="slds-m-left_x-small"></lightning-button>
                            &nbsp; &nbsp;<lightning-button variant="brand" label="Next" title="Next"
                                onclick={handleNextFromMetadataPicker} class="slds-m-left_x-small"
                                disabled={isNextButtonDisabled}></lightning-button>
                        </div>
                        <template if:true={showSpinnerNavigation}>
                            <lightning-spinner alternative-text="Loading..." size="large"></lightning-spinner>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>

                <lightning-layout>
                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col">
                                <label class="custom-label">
                                    <span class="required-asterisk">*</span> Target Org
                                    <lightning-helptext
                                        content="If the sandbox is not visible, navigate to the Orgs Tab, add the sandbox and authenticate."></lightning-helptext>
                                </label>
                                <lightning-combobox name="selectOrg" variant="label-hidden" value={selectedOrg}
                                    options={orgOptions} placeholder="Select an Org" required="true"
                                    onchange={handleOrgSelection}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <label class="custom-label">
                                    Metadata Type <!-- <span class="required-asterisk">*</span> -->
                                </label>
                                <lightning-combobox name="selectMetadata" variant="label-hidden"
                                    value={selectedMetadata} options={metadataOptions} placeholder="Select Metadata"
                                    required="false" disabled={isOrgNotSelectedYet} onchange={handleMetadataSelection}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" padding="around-small">
                        <template if:true={showSpinnerForLoadingMetadataType}>
                            <span class="exampleHolder" style="padding-top: 10%;">
                                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                            </span>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>


                <lightning-layout vertical-align="start" multiple-rows>
                    <!-- Metadata Components Section -->
                    <lightning-layout-item padding="around-small" size="12">
                        <lightning-accordion allow-multiple-sections-open class="metadata-accordion">
                            <template if:true={selectedMetadata}>
                                <lightning-accordion-section name="Metadata" label="Metadata">

                                    <div class="slds-box slds-theme_default slds-var-p-around_medium">
                                        <h1 style="font-size:16px; font-weight: bold;">All Metadata</h1>
                                        <template if:true={showSpinnerInsideMetadataBox}>
                                            <div
                                                class="spinner-container slds-align_absolute-center slds-grid slds-grid_vertical slds-grid_align-center">
                                                <lightning-spinner alternative-text="Loading"></lightning-spinner>
                                                <p class="slds-text-align_center"
                                                    style="position: absolute; top: 10%; left: 43%; color: black !important; z-index: 9999;">
                                                    Fetching the data, please wait...
                                                </p>
                                            </div>
                                        </template>
                                        <br />
                                        <template if:true={showMetadataDatatable}>
                                            <div>
                                                <lightning-input type="search" label="Search Metadata Components"
                                                    placeholder="Search metadata" onchange={handleSearchMetadata} value={metadataSearchKey}
                                                    style="max-width: 280px;"></lightning-input>
                                                <br />
                                            </div>
                                            <template if:true={filteredMetadata.length}>
                                                <div class="metadata-container" style="height: 175px;">
                                                    <lightning-datatable key-field="value" data={paginatedMetadata}
                                                        columns={metadataDatatableColumn} sorted-by={sortedByMetadata}
                                                        sorted-direction={sortDirectionMetada}
                                                        selected-rows={preselectedRows}
                                                        onrowselection={handleMetadataDatatableRowAction}
                                                        onsort={handleSortMetadata}>
                                                    </lightning-datatable>
                                                </div>

                                                <div style="position: relative; height: 5rem;">
                                                    <div
                                                        style="display: flex; justify-content: center; align-items: center; height: 100%;">
                                                        <lightning-button disabled={isFirstPageDisabled}
                                                            icon-name="utility:jump_to_left" label="First"
                                                            class="slds-p-horizontal_x-small"
                                                            alternative-text="first page"
                                                            onclick={handleFirstPage}></lightning-button>
                                                        <lightning-button disabled={isFirstPageDisabled}
                                                            icon-name="utility:chevronleft" label="Previous"
                                                            alternative-text="Previous"
                                                            onclick={handlePreviousPage}></lightning-button>
                                                        &nbsp; &nbsp; <span class="slds-badge">Showing {currentPage} of
                                                            {totalPages} Page(s)</span>
                                                        &nbsp; &nbsp;
                                                        <lightning-button disabled={isLastPageDisabled}
                                                            icon-name="utility:chevronright" label="Next"
                                                            alternative-text="Next" onclick={handleNextPage}
                                                            icon-position="right"></lightning-button>
                                                        &nbsp; <lightning-button disabled={isLastPageDisabled}
                                                            icon-name="utility:jump_to_right" label="Last"
                                                            alternative-text="last page" onclick={handleLastPage}
                                                            icon-position="right"></lightning-button>
                                                    </div>
                                                    <div
                                                        style="position: absolute; right: 0; top: 50%; transform: translateY(-50%);">
                                                        <span class="slds-badge">Total Records:
                                                            {filteredMetadata.length}</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={filteredMetadata.length}>
                                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                                 style="height: 100px">
                                            <template if:true={metadataSearchKey}>
                                                <p class="slds-text-heading_small">
                                                    No metadata components found matching your search criteria.
                                                </p>
                                            </template>
                                            <template if:false={metadataSearchKey}>
                                                <p class="slds-text-heading_small">
                                                    No data available for the selected metadata type in the org.
                                                </p>
                                            </template>
                                        </div>
                                        </template>
                                    </div>
                                    <br/>

                                    <div class="slds-box slds-theme_default slds-var-p-around_medium">
                                        <h1 style="font-size:16px; font-weight: bold;">Selected Metadata</h1>
                                        <br />
                                        <template if:true={showSelectedMD}>
                                            <div>
                                                <lightning-input type="search" label="Search Metadata Components"
                                                    placeholder="Search metadata"
                                                    onchange={handleSearchSelectedMetadata}
                                                    value={searchKeySMD}
                                                    style="max-width: 280px;"></lightning-input>
                                                <br/>
                                            </div>
                                            <template if:true={selectedMetadataListToDisplay.length}>
                                                <div class="metadata-container" style="height: 175px;">
                                                    <lightning-datatable key-field="name"
                                                        data={paginatedSelectedMetadata}
                                                        columns={selectedMetadataColumns}
                                                        sorted-by={sortedBySelectedMetadata}
                                                        sorted-direction={sortDirectionSelectedMetada}
                                                        onrowselection={handleSelectedMetadataRowAction}
                                                        onsort={handleSortSelectedMetadata}
                                                        selected-rows={preselectedRows}>
                                                    </lightning-datatable>

                                                </div>
                                                <div style="position: relative; height: 5rem;">
                                                    <div
                                                        style="display: flex; justify-content: center; align-items: center; height: 100%;">
                                                        <lightning-button disabled={isSelectedFirstPageDisabled}
                                                            icon-name="utility:jump_to_left" label="First"
                                                            class="slds-p-horizontal_x-small"
                                                            alternative-text="first page"
                                                            onclick={handleSelectedFirstPage}></lightning-button>
                                                        <lightning-button disabled={isSelectedFirstPageDisabled}
                                                            icon-name="utility:chevronleft" label="Previous"
                                                            alternative-text="Previous"
                                                            onclick={handleSelectedPreviousPage}></lightning-button>
                                                        &nbsp; &nbsp; <span class="slds-badge">Showing
                                                            {selectedCurrentPage} of {selectedTotalPages} Page(s)</span>
                                                        &nbsp; &nbsp;
                                                        <lightning-button disabled={isSelectedLastPageDisabled}
                                                            icon-name="utility:chevronright" label="Next"
                                                            alternative-text="Next" onclick={handleSelectedNextPage}
                                                            icon-position="right"></lightning-button>
                                                        &nbsp; <lightning-button disabled={isSelectedLastPageDisabled}
                                                            icon-name="utility:jump_to_right" label="Last"
                                                            alternative-text="last page"
                                                            onclick={handleSelectedLastPage}
                                                            icon-position="right"></lightning-button>
                                                    </div>
                                                    <div
                                                        style="position: absolute; right: 0; top: 50%; transform: translateY(-50%);">
                                                        <span class="slds-badge">Total Records:
                                                            {selectedMetadataListToDisplay.length}</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>

                                        <template if:false={selectedMetadataListToDisplay.length}>
                                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                            style="height: 100px">
                                                <template if:true={searchKeySMD}>
                                                    No selected metadata found matching your search criteria.
                                                </template>
                                                <template if:false={searchKeySMD}>
                                                    No metadata selected.
                                                </template>
                                           </div>
                                        </template>
                                    </div>
                                </lightning-accordion-section>
                            </template>
                        </lightning-accordion>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <!-- END OF METADATA PICKER PAGE UNDER CREATE NEW TEMPLATE -->


            <!-- DATA PICKER PAGE UNDER CREATE NEW TEMPLATE -->

            <template if:true={isDataPicker}>
                <div class="slds-grid slds-grid_vertical-align-center slds-p-around_medium">
                    <div class="progress-path-container">
                        <div class="progress-path">
                            <!-- Metadata Retrieval (Step 1) -->
                            <div class={getStepClass1}>
                                <div class="step-label">Metadata Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep1Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep1Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 1 -->
                            <div class={getLine1Class}></div>

                            <!-- Metadata Transformation (Step 2) -->
                            <div class={getStepClass2}>
                                <div class="step-label">Metadata Transformation</div>
                                <div class="step-icon">
                                    <template if:true={isStep2Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep2Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 2 -->
                            <div class={getLine2Class}></div>

                            <!-- Data Retrieval (Step 3) -->
                            <div class={getStepClass3}>
                                <div class="step-label">Data Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep3Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep3Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 3 -->
                            <div class={getLine3Class}></div>

                            <!-- Final Review (Step 4) -->
                            <div class={getStepClass4}>
                                <div class="step-label">Final Review</div>
                                <div class="step-icon">
                                    <template if:true={isStep4Complete}>
                                        <lightning-icon icon-name="utility:check" size="small"
                                            variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={isStep4Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Header Section -->
                <lightning-layout vertical-align="top">
                    <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                        <div class="slds-text-align_right">
                            <header class="slds-truncate utils" style="display: flex; align-items: right;">
                                <h1 class="slds-section__title utilTitle1">
                                    <p style="color: #3670b6; font-size:26px; font-weight: bold;">Data Retrieval</p>
                                </h1>
                            </header>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="auto" padding="around-small" size="6">
                        <div class="right-aligned-container">
                            <lightning-button variant="brand" label="Back" title="Back"

                            </footer>

                    <div class="slds-backdrop slds-backdrop_open"></div>

                <template if:true={isShowModalForFindAndReplaceValidationfortheallselection}>

                            <footer class="slds-modal__footer">
                                <button class="slds-button slds-button_neutral"

                <!-- Apex Script Validation Modal -->
                <template if:true={isShowModalForApexscriptValidation}>

                            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-5">

                                    script?</p>
                            </div>

                                <button class="slds-button slds-button_neutral"

                <template if:true={showApexScriptContent}>
                    <lightning-layout>

                            <p style="text-align: justify; margin: 0 auto; font-size: 14px; font-weight: 500;">
                                When you select the 'Apex Script' transformation rule, you can define scripts that will
                                be executed after the refresh. Scripts will be executed in the order specified.
                            </p>
                        </lightning-layout-item>
                    </lightning-layout>

                    <!-- Add New Script Form -->
                    <lightning-layout>
                        <lightning-layout-item size="12" padding="around-small">
                            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-12">
                                    <lightning-input type="number" label="Order" value={newScriptOrder} required
                                        onchange={handleOrderChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_5-of-12">
                                    <lightning-input type="search" label="Script Name" value={newScriptName} required

                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_5-of-12">

                                    <div class="slds-form-element" data-id="script-details-container">
                                        <div class="slds-form-element__control">
                                            <div class={scriptDetailsContainerClass}>
                                                <lightning-textarea id="script-details" name="script-details"
                                                    label="Script Details" required value={newScriptDetails}
                                                    placeholder="Enter your Apex script..."

                                                </lightning-textarea>

                                                    <div class="slds-form-element__help slds-m-top_x-small">
                                                        <lightning-icon icon-name={validationIconName} size="xx-small"
                                                            class="slds-m-right_xx-small"
                                                            variant={validationIconVariant}>
                                                        </lightning-icon>
                                                        <span>{validationSummary}</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-12 slds-align-bottom">
                                <lightning-button-icon icon-name="utility:new" alternative-text="Add Script"
                                    title="Add Script" onclick={handleAddScript} disabled={hasValidationErrors}>
                                </lightning-button-icon>
                            </div>
                        </lightning-layout-item>

                    </lightning-layout>

                    <!-- Improved Syntax Validation Panel - Always show when there are issues -->
                    <template if:true={hasValidationIssues}>
                        <div class="slds-box slds-m-bottom_medium slds-theme_default validation-panel">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-size_11-of-12">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">
                                        <lightning-icon icon-name="utility:info" size="small"
                                            class="slds-m-right_x-small" variant="warning"></lightning-icon>
                                        Script Validation Feedback
                                    </h3>
                                </div>
                                <div class="slds-col slds-size_1-of-12 slds-text-align_right">
                                    <lightning-button-icon icon-name="utility:close" variant="bare"
                                        alternative-text="Close" title="Close" onclick={dismissValidationWarnings}>
                                    </lightning-button-icon>
                                </div>
                            </div>

                            <div class="validation-messages slds-m-top_small">
                                <template for:each={validationMessagesByType} for:item="group">
                                    <div key={group.type} class="message-group slds-m-bottom_small">
                                        <div class="slds-grid">
                                            <div class="slds-col slds-size_1-of-12">
                                                <lightning-icon icon-name={group.icon} size="x-small"
                                                    class="slds-m-right_x-small" variant={group.variant}>
                                                </lightning-icon>
                                            </div>
                                            <div class="slds-col slds-size_11-of-12">
                                                <p class="slds-text-title slds-m-bottom_xx-small">{group.heading}</p>
                                                <ul class="slds-list_dotted">
                                                    <template for:each={group.messages} for:item="message">
                                                        <li key={message.id}
                                                            class="slds-m-vertical_xx-small slds-text-body_small"
                                                            style={message.style}>
                                                            {message.text}
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Selected Scripts Section -->
                    <lightning-layout>
                        <lightning-layout-item size="12" padding="around-small">
                            <h1 style="font-size:16px; font-weight: bold;">Selected Scripts:</h1>
                            <div class="slds-box">
                                <template if:true={hasapexScript}>
                                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-input type="search" label="Search Scripts"
                                                value={searchTermapexScript} onchange={handleSearchApexScripts}
                                                placeholder="Search by order, name or details...">
                                            </lightning-input>
                                        </div>
                                    </div>
                                <template if:true={paginatedScripts.length}> 
                                    <div class="metadata-container" style="height: 150px;">
                                        <lightning-datatable key-field="id" data={paginatedScripts} columns={columns}
                                            hide-checkbox-column sorted-by={sortedByapex}
                                            sorted-direction={sortDirectionapex} onrowaction={handleRowActionApexScript}
                                            onsort={handleSortapex}>
                                        </lightning-datatable>
                                    </div>

                                    <div class="slds-grid slds-m-top_medium">
                                        <!-- Page Size Dropdown -->
                                        <div class="slds-col slds-small-size_3-of-12 slds-align_absolute-left">
                                            <div class="slds-list_inline slds-p-bottom_xx-small">
                                                <div class="slds-clearfix" style="padding-top:3px;">
                                                    <div class="slds-float_left">
                                                        <span class="slds-badge">Page Size:</span>
                                                    </div>
                                                </div>
                                                <div class="slds-select_container">
                                                    <select class="slds-select" onchange={handlePageSizeChangeApex}>
                                                        <template for:each={pageSizeOptionsApex} for:item="option">
                                                            <option key={option.value} value={option.value}>
                                                                {option.label}
                                                            </option>
                                                        </template>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Pagination Navigation -->
                                        <div class="slds-col slds-size_1-of-2 slds-small-size_6-of-12">
                                            <lightning-button-group>
                                                <lightning-button label="First" icon-name="utility:jump_to_left"
                                                    onclick={handleFirstapex} disabled={isFirstPageapex}>
                                                </lightning-button>
                                                <lightning-button label="Previous" icon-name="utility:chevronleft"
                                                    onclick={handlePreviousapex} disabled={isFirstPageapex}>
                                                </lightning-button>
                                            </lightning-button-group>
                                            &nbsp;&nbsp;
                                            <span class="slds-badge">
                                                Showing {selectedCurrentPageApexscript} &nbsp;of&nbsp;
                                                {totalSelectedPagesApexscript} &nbsp;&nbsp;Page(s)
                                            </span>
                                            &nbsp;&nbsp;
                                            <lightning-button-group>
                                                <lightning-button label="Next" icon-name="utility:chevronright"
                                                    icon-position="right" onclick={handleNextapex}
                                                    disabled={isLastPageapex}>
                                                </lightning-button>
                                                <lightning-button label="Last" icon-name="utility:jump_to_right"
                                                    icon-position="right" onclick={handleLastapex}
                                                    disabled={isLastPageapex}>
                                                </lightning-button>
                                            </lightning-button-group>
                                        </div>

                                        <!-- Selected Records Count -->
                                        <div
                                            class="slds-col slds-size_1-of-1 slds-small-size_3-of-12 slds-align_absolute-right">
                                            <div class="slds-clearfix" style="margin-right:1%">
                                                <div class="slds-float_right">
                                                    <span class="slds-badge">Selected Records:
                                                        {totalRecordsApexscript}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template> 
                                <template if:false={paginatedScripts.length}>
                                    <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                        style="height: 100px">
                                        <p class="slds-text-heading_small">No Apex Script found matching your search criteria.
                                        </p>
                                </div>
                                </template>  
                                </template>

                                <template if:false={hasapexScript}>
                                    <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                        style="height: 100px">
                                        <p class="slds-text-heading_small">
                                            No Apex Scripts have been created yet.
                                        </p>
                                    </div>
                                </template>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </template>

            <!-- END OF FIND AND REPLACE PAGE CODE BLOCK -->


            <!-- START OF CREATE NEW TEMPLATE PAGE CODE BLOCK -->

            <template if:true={showCreateTemplatePage}>
                <div class="slds-grid slds-grid_vertical-align-center slds-p-around_medium">
                    <div class="progress-path-container">
                        <div class="progress-path">
                            <!-- Metadata Retrieval (Step 1) -->
                            <div class={getStepClass1}>
                                <div class="step-label">Metadata Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep1Complete}>
                                        <lightning-icon icon-name="utility:check" size="small" variant="inverse">
                                        </lightning-icon>
                                    </template>
                                    <template if:false={isStep1Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 1 -->
                            <div class={getLine1Class}></div>

                            <!-- Metadata Transformation (Step 2) -->
                            <div class={getStepClass2}>
                                <div class="step-label">Metadata Transformation</div>
                                <div class="step-icon">
                                    <template if:true={isStep2Complete}>
                                        <lightning-icon icon-name="utility:check" size="small" variant="inverse">
                                        </lightning-icon>
                                    </template>
                                    <template if:false={isStep2Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 2 -->
                            <div class={getLine2Class}></div>

                            <!-- Data Retrieval (Step 3) -->
                            <div class={getStepClass3}>
                                <div class="step-label">Data Retrieval</div>
                                <div class="step-icon">
                                    <template if:true={isStep3Complete}>
                                        <lightning-icon icon-name="utility:check" size="small" variant="inverse">
                                        </lightning-icon>
                                    </template>
                                    <template if:false={isStep3Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Progress Line 3 -->
                            <div class={getLine3Class}></div>

                            <!-- Final Review (Step 4) -->
                            <div class={getStepClass4}>
                                <div class="step-label">Final Review</div>
                                <div class="step-icon">
                                    <template if:true={isStep4Complete}>
                                        <lightning-icon icon-name="utility:check" size="small" variant="inverse">
                                        </lightning-icon>
                                    </template>
                                    <template if:false={isStep4Complete}>
                                        <div class="empty-circle"></div>
                                    </template>
                                </div>
                            </div>

                                </h1>

                                onclick={handleBackFromTemplateCreationPage} class="slds-m-left_x-small">
                            </lightning-button>

                                title="createTemplate" onclick={handleCreateTemplate} class="slds-m-left_x-small">
                            </lightning-button>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>

                    <lightning-layout-item size="12" padding="around-small">
                        <p style="text-align: justify; margin: 0 auto; font-size: 14px; font-weight: 500;">
                            Review the final choices for metadata retrieval, metadata transformation, and data
                            retrieval. If you need to edit or remove any of these selections, return to the
                            corresponding screen
                            and make the necessary updates.
                        </p>
                    </lightning-layout-item>
                </lightning-layout>

                <lightning-layout>
                    <lightning-layout-item size="6" padding="around-small">
                        <div class="slds-grid slds-gutters_medium">

                                <label class="custom-label">
                                    Selected Target Org:
                                </label>
                                <br />
                                <a href={recordUrl} target="_blank" class="custom-label"
                                    style="text-decoration: none; color: #0070d2; font-weight: normal;">
                                    {selectedOrgName}
                                </a>
                            </div>
                            <div class="slds-col">
                                <label class="custom-label">
                                    <span class="required-asterisk">*</span> Template Name
                                </label>
                                <lightning-input label="Template Name" variant="label-hidden" value={templateName}
                                    required onchange={handleTemplateName}></lightning-input>

                </lightning-layout>

                <!-- Accordion Container -->
                <lightning-accordion allow-multiple-sections-open>
                    <!-- Selected Metadata Section -->
                    <lightning-accordion-section name="selecteds-metadata" label="Selected Metadata">
                        <div class="slds-box">
                            <template if:true={showSelectedMD}>
                                <div>
                                    <lightning-input type="text" label="Search Metadata Components"
                                        placeholder="Search metadata" onchange={handleSearchSelectedMetadata} value={searchKeySMD}

                                    </lightning-input>
                                    <br />
                                </div>

                                <template if:true={selectedMetadataListToDisplay.length}>
                                    <div class="metadata-container" style="height: 175px;">
                                        <lightning-datatable key-field="name" data={paginatedSelectedMetadata}
                                            columns={selectedMetadataColumns} sorted-by={sortedBySelectedMetadata}
                                            sorted-direction={sortDirectionSelectedMetada}
                                            onrowselection={handleSelectedMetadataRowAction} hide-checkbox-column
                                            onsort={handleSortSelectedMetadata} selected-rows={preselectedRows}>
                                        </lightning-datatable>

                                    </div>
                                    <div style="position: relative; height: 5rem;">
                                        <div
                                            style="display: flex; justify-content: center; align-items: center; height: 100%;">
                                            <lightning-button disabled={isSelectedFirstPageDisabled}
                                                icon-name="utility:jump_to_left" label="First"
                                                class="slds-p-horizontal_x-small" alternative-text="first page"
                                                onclick={handleSelectedFirstPage}>
                                            </lightning-button>
                                            <lightning-button disabled={isSelectedFirstPageDisabled}
                                                icon-name="utility:chevronleft" label="Previous"
                                                alternative-text="Previous" onclick={handleSelectedPreviousPage}>
                                            </lightning-button>
                                            &nbsp;
                                            &nbsp;
                                            <span class="slds-badge">Showing {selectedCurrentPage} of
                                                {selectedTotalPages} Page(s)</span>
                                            &nbsp;
                                            &nbsp;
                                            <lightning-button disabled={isSelectedLastPageDisabled}
                                                icon-name="utility:chevronright" label="Next" alternative-text="Next"
                                                onclick={handleSelectedNextPage} icon-position="right">
                                            </lightning-button>
                                            &nbsp;
                                            <lightning-button disabled={isSelectedLastPageDisabled}
