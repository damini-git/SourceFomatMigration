<template>
    <!-- START OF REFRESH PAGE CODE BLOCK -->
    <!-- <iframe id="vfIframe" src="/apex/AuthCodeCallbackVfpForSRA"> </iframe> -->
    <!--<div><p>Hello</p></div>-->
    <div class="nonClickable">
        <lightning-progress-indicator current-step={currentvalue} type="path" variant="base">
            <lightning-progress-step label="Pre-Refresh" value="1" class={step1Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Sandbox Refresh" value="2" class={step2Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Metadata Restore" value="3" class={step6Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Metadata Transformation" value="4" class={step4Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Data Restore" value="5" class={step3Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Data Transformation" value="6" class={step5Class} >
            </lightning-progress-step>
            <lightning-progress-step label="Users Transformation" value="7" class={step5Class} >
            </lightning-progress-step>
        </lightning-progress-indicator>
    </div>
    <br/>


    <!-- Pre-Refresh Details Page -->
    <template if:true={showDataRetrievalPage}>

        <lightning-layout vertical-align="top">
            <lightning-layout-item flexibility="auto" padding="around-small">
                <div class="slds-text-align_right">
                    <header class="slds-truncate utils" style="display: flex; align-items: right;">
                        <h1 class="slds-section__title utilTitle1">
                            <p style="color: #3670b6; font-size:23px; font-weight: bold;">Pre Refresh</p>
                        </h1>
                    </header>
                </div>
            </lightning-layout-item>
            <!-- Button Row -->

            <lightning-layout-item flexibility="auto" padding="around-small">
                <div class="slds-grid right-aligned-container">

                    <lightning-button variant="brand" label="Retrieve Metadata" onclick={handleRetrieveMetadata}
                        disabled={isRetrieveMetadataDisabled} class="slds-m-left_x-small">
                    </lightning-button>


                    <lightning-button variant="brand" label="Retrieve Data" onclick={handleRetrieveData}
                        disabled={isRetrieveDataDisabled} class="slds-m-left_x-small">
                    </lightning-button>


                    <lightning-button variant="brand" label="Edit Template" onclick={handleEditTemplate}
                        disabled={isEditTemplateDisabled} class="slds-m-left_x-small">
                    </lightning-button>

                    <!-- 🔁 Refresh Icon -->
                    <template if:true={showRefreshIconPre}>
                        <lightning-button-icon icon-name="utility:refresh" variant="brand" title="Refresh" onclick={handleRefreshClickPre}
                            class="slds-m-left_x-small">
                        </lightning-button-icon>
                    </template>

                    <lightning-button label="Next" variant="brand" onclick={handleNextToSandboxpage}
                        disabled={isNextDisabled} class="slds-m-left_x-small">
                    </lightning-button>
                </div>
            </lightning-layout-item>
        </lightning-layout>

        <template if:true={isLoading}>
            <div class="spinnerHolder">
                <lightning-spinner alternative-text="Loading" size="large" variant="brand">
                </lightning-spinner>
            </div>
        </template>

        <!-- Modal for Checkboxes -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            onclick={closeModalDataretieval}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="close"
                                class="slds-button__icon slds-button__icon_large"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Choose Data to Regenerate</h2>
                    </header>

                    <!-- Modal/Popup Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <!-- Message above checkboxes -->
                        <div class="slds-text-color_default slds-m-bottom_small">
                            All options are selected by default, and the selected ones will be regenerated.
                            Uncheck any option if you do <strong>not</strong> want it to be regenerated.
                        </div>


                      <!--  <template if:true={templateFields.customSettingNames}>-->
                        <template if:true={hasCustomSettings}>
                            <lightning-input type="checkbox" label="Regenerate Custom Settings" name="customSettings"
                                checked={customSettingsChecked} onchange={handleCheckboxChange}>
                            </lightning-input>
                        </template>

                        <template if:true={templateFields.isScheduledJobsSelected}>
                            <lightning-input type="checkbox" label="Regenerate Scheduled Jobs" name="scheduledJobs"
                                checked={scheduledJobsChecked} onchange={handleCheckboxChange}>
                            </lightning-input>
                        </template>

                        <template if:true={templateFields.isUserDataSelected}>
                            <lightning-input type="checkbox" label="Regenerate Users" name="users"
                                checked={usersChecked} onchange={handleCheckboxChange}>
                            </lightning-input>
                        </template>
                    </div>

                    <!-- Modal/Popup Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModalDataretieval}>
                        </lightning-button>
                        <lightning-button variant="brand" label="Submit" onclick={handleSubmitDataretrieval}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Warning Message -->
        <template if:false={isLoading}>
            <template if:true={showWarningMessage}>
                <div class="slds-box slds-box_xx-small slds-theme_alert-texture slds-theme_warning">
                    <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning Icon"
                        class="warning-icon"></lightning-icon>
                    <span class="message">
                        {warningMessage}
                    </span>
                </div>
            </template>

            <template if:true={showMainContent}>

                <div class="slds-box">

                    <!-- Metadata Information Box -->
                    <div class="slds-box slds-m-top_medium">
                        <div class="slds-text-heading_small">Sandbox Metadata Pre-Refresh Information</div>
                        <div class="slds-m-top_small">

                            <template if:true={isLoading}>
                                <lightning-spinner alternative-text="Loading metadata components" size="small">
                                </lightning-spinner>
                            </template>
                            <template if:false={isLoading}>
                                <template if:true={originalMetadataComponents.length}>
                                    <!-- Search and Reset Section -->
                                    <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                                        <div class="slds-col slds-size_4-of-12">
                                            <lightning-input type="search" label="Search Metadata"
                                                value={searchTermMetadata} onchange={handleSearchMetadata}>
                                            </lightning-input>
                                        </div>
                                        <!--  <div class="slds-col slds-size_4-of-12 slds-align_absolute-center">
                                            <lightning-button label="Reset" onclick={handleResetMetadata}
                                                variant="destructive" disabled={isExecuting}>
                                            </lightning-button>
                                        </div> -->
                                        <template if:true={isLoading}>
                                            <lightning-spinner alternative-text="Loading metadata components">
                                            </lightning-spinner>
                                        </template>
                                    </div>

                                    <h3 class="slds-text-heading_small slds-m-top_medium">Selected Metadata Information
                                    </h3>
                                    &nbsp;
                                    <template if:true={filteredMetadata.length}>
                                        <div class="metadata-container" style="height: 178px;">
                                            <lightning-datatable key-field="index" data={displayMetadata}
                                                columns={columnsMetadata} hide-checkbox-column sortable
                                                onsort={handleMetadataSort} sorted-by={sortedBy}
                                                sorted-direction={sortDirection}>
                                            </lightning-datatable>
                                        </div>

                                        <!-- Pagination Controls -->
                                        <div class="slds-grid slds-m-top_medium">
                                            <!-- Left Column: Page Size -->
                                            <div
                                                class="slds-col slds-size_1-of-1 slds-small-size_4-of-12 slds-align_absolute-left">
                                                <div class="slds-list_inline slds-p-bottom_xx-small">
                                                    <div class="slds-clearfix" style="padding-top: 3px;">
                                                        <div class="slds-float_left">
                                                            <span class="slds-badge">Page Size:</span>
                                                        </div>
                                                    </div>
                                                    <div class="slds-select_container">
                                                        <select class="slds-select" style="width: auto;"
                                                            onchange={handleMetadataPageSize}>
                                                            <template for:each={metadataPageSizeOptions}
                                                                for:item="option">
                                                                <option key={option} value={option}>{option}</option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Center Column: Pagination -->
                                            <div class="slds-col slds-size_1-of-2 slds-small-size_6-of-12">
                                                <lightning-button label="Previous" size="small"
                                                    onclick={handlePrevMetadataPage} disabled={isFirstMetadataPage}>
                                                </lightning-button>
                                                &nbsp;&nbsp;
                                                <span class="slds-badge">
                                                    Showing {currentMetadataPage} &nbsp;of&nbsp; {totalMetadataPages}
                                                    &nbsp;&nbsp;Page(s)
                                                </span>
                                                &nbsp;
                                                <lightning-button label="Next" size="small"
                                                    onclick={handleNextMetadataPage} disabled={isLastMetadataPage}>
                                                </lightning-button>
                                            </div>

                                            <!-- Right Column: Total Records -->
                                            <div
                                                class="slds-col slds-size_1-of-1 slds-small-size_2-of-12 slds-align_absolute-right">
                                                <div class="slds-clearfix" style="margin-right: 1%">
                                                    <div class="slds-float_right">
                                                        <span class="slds-badge">Total Records:
                                                            {totalMetadataRecords}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- No Search Results Message -->
                                    <template if:false={filteredMetadata.length}>
                                        <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                              style="height: 100px">
                                             <p class="slds-text-heading_small">
                                                    No metadata components found matching your search criteria.
                                             </p>       
                                            </div>
                                        
                                    </template>
                                </template>

                                <!-- No Data Available Message -->
                                <template if:false={originalMetadataComponents.length}>

                                    <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                        style="height: 100px">
                                        <p class="slds-text-heading_small">
                                            No metadata was selected during template creation.
                                        </p>
                                    </div>

                                </template>
                            </template>
                        </div>
                    </div>

                    <!-- User Information Box -->
                    <div class="slds-box slds-m-top_medium">
                        <div class="slds-text-heading_small">Sandbox Data Pre-Refresh Information</div>
                        <div class="slds-m-top_small">
                            <div class="slds-box slds-m-top_medium">
                                <div class="slds-text-heading_small">Selected User Information</div>
                                <div class="slds-m-top_small">
                                    <!-- Loading State -->
                                    <template if:true={isLoadingUsersPre}>
                                        <lightning-spinner alternative-text="Loading users..." size="small">
                                        </lightning-spinner>
                                    </template>
                                    <template if:false={isLoadingUsersPre}>
                                        <template if:true={originalUsersPre.length}>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                                                <div class="slds-col slds-size_4-of-12">
                                                    <lightning-input type="search" label="Search Users"
                                                        value={userSearchOnLoadPre} onchange={handleUserSearchChangeOnLoadPre}>
                                                    </lightning-input>
                                                </div>
                                               
                                                <template if:true={isExecutingPre}>
                                                    <lightning-spinner alternative-text="Executing the process...">
                                                    </lightning-spinner>
                                                </template>
                                            </div>

                                            <h3 class="slds-text-heading_small slds-m-top_medium">Users</h3>
                                            &nbsp;
                                            <template if:true={filteredUsersPre.length}>
                                                <div class="metadata-container" style="height: 178px;">
                                                    <lightning-datatable key-field="id" data={pagedUsersPre}
                                                        columns={userColumns}
                                                        hide-checkbox-column onsort={handleUserSortPre}
                                                        sorted-by={sortedBy} sorted-direction={sortDirection}>
                                                    </lightning-datatable>
                                                </div>

                                                <!-- Pagination Controls for Users -->
                                                <div class="slds-grid slds-m-top_medium">
                                                    <!-- Left Column: Page Size Dropdown -->
                                                    <div
                                                        class="slds-col slds-size_1-of-1 slds-small-size_4-of-12 slds-align_absolute-left">
                                                        <div class="slds-list_inline slds-p-bottom_xx-small">
                                                            <div class="slds-clearfix" style="padding-top: 3px;">
                                                                <div class="slds-float_left">
                                                                    <span class="slds-badge">Page Size:</span>
                                                                </div>
                                                            </div>
                                                            <div class="slds-select_container">
                                                                <select class="slds-select"
                                                                    id="recordsPerPageUsersprerefresh"
                                                                    style="width: auto;"
                                                                    onchange={handleRecordsPerPagePre}>
                                                                    <template for:each={pageSizeOptions}
                                                                        for:item="option">
                                                                        <option key={option} value={option}>{option}
                                                                        </option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- Center Column: Pagination Buttons -->
                                                    <div class="slds-col slds-size_1-of-2 slds-small-size_6-of-12">
                                                        <lightning-button label="Previous" size="small"
                                                            onclick={handlePrevPageUsersPre} disabled={isFirstPageUsersPre}>
                                                        </lightning-button>
                                                        &nbsp;&nbsp;
                                                        <span class="slds-badge">
                                                            Showing {currentPageUsersPre} &nbsp;of&nbsp; {totalPagesUsersPre}
                                                            &nbsp;&nbsp;Page(s)
                                                        </span>
                                                        &nbsp;
                                                        <lightning-button label="Next" size="small"
                                                            onclick={handleNextPageUsersPre} disabled={isLastPageUsersPre}>
                                                        </lightning-button>
                                                    </div>

                                                    <!-- Right Column: Total Records -->
                                                    <div class="slds-col slds-size_1-of-1 slds-small-size_2-of-12 slds-align_absolute-right">
                                                        <div class="slds-clearfix" style="margin-right: 1%">
                                                            <div class="slds-float_right">
                                                                <span class="slds-badge">Total Records: {filteredUsersPre.length}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={filteredUsersPre.length}>
                                                <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                                     style="height: 100px">
                                                <p class="slds-text-heading_small">
                                                    No users found matching your search criteria.
                                                </p>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={originalUsersPre.length}>
                                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                                style="height: 100px">
                                                <p class="slds-text-heading_small">
                                                    No user data was selected during template creation.
                                                </p>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                            <!-- Custom Settings Box -->
                            <div class="slds-box slds-m-top_medium">
                                <div class="slds-text-heading_small">Selected Custom Settings Information</div>
                                <div class="slds-m-top_small">
                                    <!-- Loading State -->
                                    <template if:true={isLoadingCustomSettings}>
                                        <lightning-spinner alternative-text="Loading custom settings..." size="small">
                                        </lightning-spinner>
                                    </template>

                                    <!-- Content State -->
                                    <template if:false={isLoadingCustomSettings}>
                                        <template if:true={originalCustomSettings.length}>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                                                <div class="slds-col slds-size_4-of-12">
                                                    <lightning-input type="search" label="Search Custom Settings"
                                                        value={customSettingsSearch}
                                                        onchange={handleCustomSettingsSearchChange}>
                                                    </lightning-input>
                                                </div>
                                                <!--   <div class="slds-col slds-size_4-of-12 slds-align_absolute-right">
                                                    <lightning-button label="Reset" onclick={handleResetCustomSettings}
                                                        variant="destructive"></lightning-button>
                                                </div> -->
                                            </div>

                                            <h3 class="slds-text-heading_small slds-m-top_medium">Custom Settings</h3>

                                            <template if:true={filteredCustomSettings.length}>
                                                <div class="slds-m-top_medium">
                                                    <div class="metadata-container" style="height: 178px;">
                                                        <lightning-datatable key-field="id" data={pagedCustomSettings}
                                                            columns={customSettingsColumns}
                                                            onrowselection={handleRowSelectioncustomsettings}
                                                            selected-rows={selectedCustomSettings} hide-checkbox-column
                                                            onsort={handleCustomSettingsSort} sorted-by={sortedBy}
                                                            sorted-direction={sortDirection}>
                                                        </lightning-datatable>
                                                    </div>
                                                </div>

                                                <!-- Pagination Controls -->
                                                <div class="slds-grid slds-m-top_medium">
                                                    <!-- Page Size Selector -->
                                                    <div
                                                        class="slds-col slds-size_1-of-1 slds-small-size_4-of-12 slds-align_absolute-left">
                                                        <div class="slds-list_inline slds-p-bottom_xx-small">
                                                            <div class="slds-clearfix" style="padding-top: 3px;">
                                                                <div class="slds-float_left">
                                                                    <span class="slds-badge">Page Size:</span>
                                                                </div>
                                                            </div>
                                                            <div class="slds-select_container">
                                                                <select class="slds-select"
                                                                    id="recordsPerprerefreshPageCustomSettings"
                                                                    style="width: auto;"
                                                                    onchange={handleRecordsPerPagecustomsettings}>
                                                                    <template for:each={pageSizeOptions}
                                                                        for:item="option">
                                                                        <option key={option} value={option}>{option}
                                                                        </option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- Pagination Controls -->
                                                    <div class="slds-col slds-size_1-of-2 slds-small-size_6-of-12">
                                                        <lightning-button label="Previous"
                                                            onclick={handlePrevPageCustomSettings}
                                                            disabled={isFirstPageCustomSettings}></lightning-button>
                                                        &nbsp;&nbsp;
                                                        <span class="slds-badge">
                                                            Showing {currentPageCustomSettings} &nbsp;of&nbsp;
                                                            {totalPagesCustomSettings} &nbsp;&nbsp;Page(s)
                                                        </span>
                                                        &nbsp;
                                                        <lightning-button label="Next"
                                                            onclick={handleNextPageCustomSettings}
                                                            disabled={isLastPageCustomSettings}></lightning-button>
                                                    </div>

                                                    <!-- Total Records -->
                                                    <div class="slds-col slds-size_2-of-12 slds-align_absolute-right">
                                                        <div class="slds-clearfix" style="margin-right: 1%">
                                                            <div class="slds-float_right">
                                                                <span class="slds-badge">Total Records:
                                                                    {filteredCustomSettings.length}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={filteredCustomSettings.length}>
                                                <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                                style="height: 100px">
                                                <p class="slds-text-heading_small">
                                                    No custom settings found matching your search criteria.
                                                </p>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={originalCustomSettings.length}>
                                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                                style="height: 100px">
                                                <p class="slds-text-heading_small">
                                                    No custom settings were selected during template creation.
                                                </p>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>
                            <!-- Schedule Jobs Box -->
                            <div class="slds-box slds-m-top_medium">
                                <div class="slds-text-heading_small">Selected Schedule Jobs Information</div>
                                <div class="slds-m-top_small">
                                    <!-- Loading State -->
                                    <template if:true={isLoading.scheduleJobs}>
                                        <lightning-spinner alternative-text="Loading schedule jobs..." size="small">
                                        </lightning-spinner>
                                    </template>

                                    <!-- Content State -->
                                    <template if:false={isLoading.scheduleJobs}>
                                        <template if:true={scheduleJobs.length}>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                                                <div class="slds-col slds-size_4-of-12">
                                                    <lightning-input type="search" label="Search Schedule Jobs"
                                                        value={scheduleJobsSearch}
                                                        onchange={handleScheduleJobsSearchChange}>
                                                    </lightning-input>
                                                </div>
                                                <!--   <div class="slds-col slds-size_4-of-12 slds-align_absolute-center">
                                                    <lightning-button label="Reset" onclick={handleResetScheduleJobs}
                                                        variant="destructive">
                                                    </lightning-button>
                                                </div> -->
                                            </div>

                                            <h3 class="slds-text-heading_small slds-m-top_medium">Schedule Jobs</h3>
                                            &nbsp;&nbsp;
                                            <template if:true={filteredScheduleJobs.length}>

                                                <div class="metadata-container">
                                                    <lightning-datatable key-field="id" data={pagedScheduleJobs}
                                                        columns={scheduleJobsColumns} class="slds-m-top_medium"
                                                        hide-checkbox-column style="width: 100%"
                                                        onsort={handleScheduleJobsSort} sorted-by={sortedBy}
                                                        sorted-direction={sortDirection}>
                                                    </lightning-datatable>
                                                </div>


                                                <!-- Pagination Controls -->
                                                <div class="slds-grid slds-m-top_medium">
                                                    <!-- Page Size Selector -->
                                                    <div
                                                        class="slds-col slds-size_1-of-1 slds-small-size_4-of-12 slds-align_absolute-left">
                                                        <div class="slds-list_inline slds-p-bottom_xx-small">
                                                            <div class="slds-clearfix" style="padding-top: 3px;">
                                                                <div class="slds-float_left">
                                                                    <span class="slds-badge">Page Size:</span>
                                                                </div>
                                                            </div>
                                                            <div class="slds-select_container">
                                                                <select class="slds-select"
                                                                    id="recordsPerPageScheduleJobsprerefresh"
                                                                    style="width: auto;"
                                                                    onchange={handleRecordsPerPageSchedule}>
                                                                    <template for:each={pageSizeOptions}
                                                                        for:item="option">
                                                                        <option key={option} value={option}>{option}
                                                                        </option>
                                                                    </template>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <!-- Pagination Controls -->
                                                    <div class="slds-col slds-size_1-of-2 slds-small-size_6-of-12">
                                                        <lightning-button label="Previous"
                                                            onclick={handlePrevPageScheduleJobs}
                                                            disabled={isFirstPageScheduleJobs}></lightning-button>
                                                        &nbsp;&nbsp;
                                                        <span class="slds-badge">
                                                            Showing {currentPageScheduleJobs} &nbsp;of&nbsp;
                                                            {totalPagesScheduleJobs} &nbsp;&nbsp;Page(s)
                                                        </span>
                                                        &nbsp;
                                                        <lightning-button label="Next"
                                                            onclick={handleNextPageScheduleJobs}
                                                            disabled={isLastPageScheduleJobs}></lightning-button>
                                                    </div>

                                                    <!-- Total Records -->
                                                    <div class="slds-col slds-size_2-of-12 slds-align_absolute-right">
                                                        <div class="slds-clearfix" style="margin-right: 1%">
                                                            <div class="slds-float_right">
                                                                <span class="slds-badge">Total Records:

                            <button class="slds-button slds-button_brand" onclick={confirmDeactivate}>OK</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- Loading spinner -->
            <template if:true={isLoadingTrans}>
                <div class="slds-spinner_container">
                    <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                        <span class="slds-assistive-text">Loading</span>
                        <div class="slds-spinner__dot-a"></div>
                        <div class="slds-spinner__dot-b"></div>
                    </div>
                </div>
            </template>

            <!-- Main Users Table Section -->
            <div class="slds-box slds-m-top_medium">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-1">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col">
                                <h2 class="slds-text-heading_medium">{currentView}</h2>
                            </div>
                            <div class="slds-col slds-text-align_right">
                                <div class="slds-form-element">
                                    <div class="slds-form-element__control">
                                        <div class="slds-input-has-icon slds-input-has-icon_left">
                                            <lightning-icon icon-name="utility:search" size="x-small"
                                                class="slds-icon slds-input__icon slds-input__icon_left">
                                            </lightning-icon>
                                            <input type="text" class="slds-input" data-id="searchInput" placeholder="Search" onkeyup={handleSearchKey} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Alphabet filter -->
                        <div class="slds-grid slds-wrap slds-m-top_x-small">
                            <template for:each={alphabetList} for:item="letter">
                                <div key={letter.value} class="slds-p-around_xxx-small">
                                    <a href="javascript:void(0);" class={letter.className}
                                        onclick={handleAlphabetFilter} data-letter={letter.value}>{letter.label}</a>
                                </div>
                            </template>
                        </div>

                    <template if:true={displayedUsers.length}>

                        <!-- Available Users Datatable -->
                        <div class="metadata-container" style="height: 300px; overflow-y: auto;">
                            <lightning-datatable data-id="availableUsersTable" key-field="username"
                                data={displayedUsers} columns={columns} sorted-by={sortedByTrans}
                                sorted-direction={sortDirectionTrans} selected-rows={selectedUsernames}
                                onrowselection={handleRowSelectionTrans} onsort={handleSortTrans}>
                            </lightning-datatable>
                        </div>

                        <!-- Pagination -->
                        <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                            <div class="slds-col slds-size_1-of-4 slds-small-size_3-of-12 slds-align_absolute-left">
                                <div class="slds-list_inline slds-p-bottom_xx-small">
                                    <div class="slds-clearfix" style="padding-top:3px;">
                                        <div class="slds-float_left">
                                            <span class="slds-badge">Page Size:</span>
                                        </div>
                                    </div>
                                    <div class="slds-select_container">
                                        <select class="slds-select" style="width: auto;" onchange={handlePageSizeChangeTrans}>
                                            <template for:each={pageSizeOptionsTrans} for:item="option">
                                                <option key={option} value={option}>{option}</option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="slds-col slds-size_8-of-12 slds-text-align_center">
                                <div class="slds-button-group" role="group">
                                    <button class="slds-button slds-button_neutral" onclick={handlePreviousTrans} disabled={isPreviousDisabled}>Previous</button>
                                    &nbsp;&nbsp;
                                    <span class="slds-badge">
                                                                    Showing {pageNumberUsers} &nbsp;of&nbsp; {totalPagesAvailable} &nbsp;&nbsp;Page(s)
                            </span>
                                    &nbsp;
                                    <button class="slds-button slds-button_neutral" onclick={handleNextTrans} disabled={isNextUsersDisabled}>Next</button>
                                </div>
                            </div>
                            <!-- Record Count -->
                            <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-12 slds-align_absolute-right">
                                <div class="slds-clearfix" style="margin-right:1%">
                                    <div class="slds-float_right">
                                        <span class="slds-badge">Total Records: {totalRecordsUsers}</span>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </template>
                    <template if:false={displayedUsers.length}>
                        <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                style="height: 100px">
                                <p class="slds-text-heading_small">
                                    No users found for the selected type.
                                </p>
                         </div>
                    </template> 

                    </div>
                </div>
            </div>
            <template if:true={showSelectedUserTable}>
            <!-- Selected Users Section -->
            <div class="slds-box slds-m-top_medium">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col slds-size_1-of-1">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col">
                                <h2 class="slds-text-heading_medium">Selected Users</h2>
                            </div>
                            <div class="slds-col slds-text-align_right">
                                <div class="slds-form-element">
                                    <div class="slds-form-element__control">
                                        <div class="slds-input-has-icon slds-input-has-icon_left">
                                            <lightning-icon icon-name="utility:search" size="x-small"
                                                class="slds-icon slds-input__icon slds-input__icon_left">
                                            </lightning-icon>
                                            <input type="text" class="slds-input" placeholder="Search Selected Users"
                                        onkeyup={handleSelectedSearch} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    <template if:true={displayedSelectedUsers.length}>

                        <!-- Selected Users Datatable -->
                        <div class="metadata-container" style="height: 300px; overflow-y: auto;">
                            <lightning-datatable data-id="selectedUsersTable" key-field="username"
                                data={displayedSelectedUsers} columns={columns} sorted-by={selectedSortedByTrans}
                                sorted-direction={selectedSortDirectionTrans}
                                onrowselection={handleSelectedRowSelection} onsort={handleSortSelectedTrans}
                                selected-rows={selectedUsernames}>
                            </lightning-datatable>
                        </div>

                        <!-- Selected Users Pagination -->
                        <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                            <div class="slds-col slds-size_1-of-4 slds-small-size_3-of-12 slds-align_absolute-left">
                                <div class="slds-list_inline slds-p-bottom_xx-small">
                                    <div class="slds-clearfix" style="padding-top:3px;">
                                        <div class="slds-float_left">
                                            <span class="slds-badge">Page Size:</span>
                                        </div>
                                    </div>
                                    <div class="slds-select_container">
                                        <select class="slds-select" style="width: auto;" onchange={handleSelectedPageSizeChange}>
                                <template for:each={selectedPageSizeOptionstrans} for:item="option">
                                    <option key={option} value={option}>{option}</option>
                                </template>
                            </select>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_8-of-12 slds-text-align_center">
                                <div class="slds-button-group" role="group">
                                    <button class="slds-button slds-button_neutral" onclick={handleSelectedPreviousTrans}
                                disabled={isSelectedPreviousDisabled}>Previous</button>
                                    &nbsp;&nbsp;
                                    <span class="slds-badge">
                                {selectedPaginationText}
                            </span>
                                    &nbsp;
                                    <button class="slds-button slds-button_neutral" onclick={handleSelectedNextTrans}
                                disabled={isSelectedNextDisabled}>Next</button>
                                </div>
                            </div>

                            <!-- Record Count -->
                            <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-12 slds-align_absolute-right">
                                <div class="slds-clearfix" style="margin-right:1%">
                                    <div class="slds-float_right">
                                        <span class="slds-badge">Total Records: {totalSelectedRecords}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                        <template if:false={displayedSelectedUsers.length}>
                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                                    style="height: 100px">
                                    <p class="slds-text-heading_small">
                                        No users found for the selected type.
                                    </p>
                             </div>
                        </template> 
                    </div>
                </div>
            </div>
          </template>

            <!-- Other Information Section -->

            <div class="slds-box slds-m-top_medium">
                <!--<h2 style="font-size:16px; font-weight:bold; color:#4b4b4b; margin-bottom: 16px;"> Logs Information
                    </h2>-->
                <h2 class="slds-text-heading_medium">Logs Information</h2>

                <div class="slds-m-top_small" style="display: flex; align-items: center;">
                    <lightning-icon icon-name="utility:info" alternative-text="Disclaimer" size="small"
                        style="margin-right: 0.5rem;"></lightning-icon>
                    <p class="slds-text-body_regular" style="font-size:14px; margin: 0;">
                        Please click on refresh icon or refresh the page to see Log Details after execution.
                    </p>
                </div>
                <br/>
                <h2 style="font-size:14px; font-weight:bold; color:#4b4b4b; margin-bottom: 16px;">
                    Password Reset </h2>
                <div class="slds-grid slds-gutters slds-wrap">
                    <!-- Left Column -->
                    <div class="slds-col slds-size_1-of-2">
                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Password Reset Status
                                </label>
                            <br>
                            <label class="custom-label" style="font-weight: normal; margin-bottom: 0;">
                                    {passwordResetStatus}
                                </label>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Password Reset Log
                                </label>
                            <br>
                            <a href={passwordResetLogUrl} target="_blank" class="custom-label"
                                style="text-decoration: none; color: #0070d2; font-weight: normal;  margin-bottom: 0;">
                                {passwordResetLog}
                            </a>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>


                    </div>
                </div>

                <h2 style="font-size:14px; font-weight:bold; color:#4b4b4b; margin-bottom: 16px;">
                    Invalid Users Removal </h2>
                <div class="slds-grid slds-gutters slds-wrap">

                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Invalid Removal Status
                                </label>
                            <br>
                            <label class="custom-label" style="font-weight: normal; margin-bottom: 0;">
                                    {invalidRemovalStatus}
                                </label>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Invalid Removal Log
                                </label>
                            <br>
                            <a href={invalidRemovalLogUrl} target="_blank" class="custom-label"
                                style="text-decoration: none; color: #0070d2; font-weight: normal; margin-bottom: 0;">
                                {invalidRemovalLog}
                            </a>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>

                    </div>

                </div>
                <h2 style="font-size:14px; font-weight:bold; color:#4b4b4b; margin-bottom: 16px;">
                    User Activation </h2>
                <div class="slds-grid slds-gutters slds-wrap">

                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Users Activation Status
                                </label>
                            <br>
                            <label class="custom-label" style="font-weight: normal; margin-bottom: 0;">
                                    {activationStatus}
                                </label>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Users Activation Log
                                </label>
                            <br>
                            <a href={activationLogUrl} target="_blank" class="custom-label"
                                style="text-decoration: none; color: #0070d2; font-weight: normal; margin-bottom: 0;">
                                {activationLog}
                            </a>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>

                    </div>

                </div>
                <h2 style="font-size:14px; font-weight:bold; color:#4b4b4b; margin-bottom: 16px;">
                    User Deactivation </h2>
                <div class="slds-grid slds-gutters slds-wrap">

                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Users Deactivation Status
                                </label>
                            <br>
                            <label class="custom-label" style="font-weight: normal; margin-bottom: 0;">
                                    {deactivationStatus}
                                </label>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">

                        <div class="slds-m-bottom_medium">
                            <label class="custom-label" style="font-weight: normal;">
                                    Latest Users Deactivation Log
                                </label>
                            <br>
                            <a href={deactivationLogUrl} target="_blank" class="custom-label"
                                style="text-decoration: none; color: #0070d2; font-weight: normal; margin-bottom: 0;">
                                {deactivationLog}
                            </a>
                            <div class="slds-has-divider_bottom-space" style="margin-top: 0;"></div>
                        </div>

                    </div>

                </div>
            </div>

            <!-- Toast Message -->
            <template if:true={showToast}>
                <div class={toastClass} role="alert">
                    <span class="slds-assistive-text">{toastType}</span>
                    <span class="slds-icon_container slds-icon-utility-success slds-m-right_small" title={toastType}>
                        <lightning-icon icon-name={toastIcon} variant="inverse" size="small"></lightning-icon>
                    </span>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">{toastMessage}</h2>
                    </div>
                    <button class="slds-button slds-button_icon slds-notify__close slds-button_icon-inverse" title="Close" onclick={closeToast}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </div>
            </template>
        </div>
    </template>
    <!-- END OF THE USER TRANSFORMATION PAGE CODE BLOCK -->




</template>
