<template>
    <lightning-card title="Contact List">
        <template if:true={contacts}>
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
                hide-checkbox-column="true">
            </lightning-datatable>
        </template>

        <template if:true={errors}>
            <div class="slds-box slds-theme_alert-texture slds-theme_error">
                <template for:each={errors} for:item="err">
                    <p key={err}>{err}</p>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
