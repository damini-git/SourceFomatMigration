<template>
    <lightning-card title="Execution Results">
        <div class="inner-content">
            <!-- File Selector -->
            <template if:true={fileOptions.length}>
                <lightning-combobox
                    name="filePicklist"
                    label="Select File"
                    value={selectedFileName}
                    options={fileOptions}
                    onchange={handleFileChange}
                    class="slds-m-bottom_small"
                    style="width: 400px;">
                </lightning-combobox>
            </template>

            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>


            <template if:true={showSearchBar}>
                <lightning-input
                        label="Search"
                        value={searchQuery}
                        onchange={handleSearchChange}
                        placeholder="Search content"
                        style="width: 400px;"
                        class="slds-m-bottom_small">
                    </lightning-input>
            </template><br/>
            
            <!-- Datatable -->
            <template if:true={pagedData.length}>
                    <div class="metadata-container" style="height: 180px;">
                        <lightning-datatable
                            key-field="id"
                            data={pagedData}
                            columns={columns}
                            onsort={handleSort}
                            sorted-by={sortBy}
                            sorted-direction={sortDirection}
                            hide-checkbox-column="true">
                        </lightning-datatable>

                    </div>
                <br/>

                <!-- Pagination Controls -->
            <div class="slds-grid slds-m-top_medium slds-p-horizontal_small slds-wrap slds-align_absolute-center">
                
                <!-- Left: Page Size -->
                <div class="slds-col slds-size_1-of-4 slds-grid slds-align-middle">
                    <span class="slds-badge slds-m-right_x-small">Page Size:</span>
                    <div class="slds-select_container">
                        <select class="slds-select" onchange={handlePageSizeChange}>
                            <template for:each={pageSizeOptions} for:item="option">
                                <option key={option} value={option}>{option}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Center: Page Navigation -->
                <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                    <lightning-button-group>
                        <lightning-button label="First" onclick={handleFirst} disabled={isFirstPage}></lightning-button>
                        <lightning-button label="Previous" onclick={handlePrev} disabled={isFirstPage}></lightning-button>
                    </lightning-button-group>

                    &nbsp;&nbsp;
                    <span class="slds-badge">Showing {currentPage} of {totalPages} Page(s)</span>
                    &nbsp;&nbsp;

                    <lightning-button-group>
                        <lightning-button label="Next" onclick={handleNext} disabled={isLastPage}></lightning-button>
                        <lightning-button label="Last" onclick={handleLast} disabled={isLastPage}></lightning-button>
                    </lightning-button-group>
                </div>

                <!-- Right: Total Records -->
                <div class="slds-col slds-size_1-of-4 slds-text-align_right">
                    <span class="slds-badge">Total Records: {totalRecords}</span>
                </div>
            </div>
            </template>

            <!-- No Match Found Message -->
            <template if:true={hasLoadedCsv}>
                <template if:false={pagedData.length}>
                    <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-align_absolute-center"
                          style="height: 100px">
                        <p class="slds-text-heading_small">
                                No results for current search.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
